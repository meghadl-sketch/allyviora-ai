<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allyviora AI | Career companion</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,sans-serif;color:#163b38;background:#f1f8f5}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:#17664f;color:white}button:hover{background:#124b3c}button:focus-visible{outline:3px solid #bf8a26}aside{position:fixed;width:245px;inset:0 auto 0 0;background:#fff;padding:22px;overflow:auto;border-right:1px solid #dce9e3}aside img{width:100%;border-radius:12px}aside button{display:block;width:100%;text-align:left;background:transparent;color:#163b38;margin:5px 0}aside button:hover,aside button.active{background:#d9f3e7}main{margin-left:245px;padding:32px;max-width:1500px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}h1,h2,h3,p{margin-top:0}h1{font-size:34px;line-height:1.2}h2{font-size:23px}.hero{background:linear-gradient(120deg,#b4eed6,#e5f8ee);padding:32px;border-radius:22px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border:1px solid #dce9e3;border-radius:16px;padding:22px;margin-bottom:16px}.tile{text-align:left;color:#163b38;background:white;border:1px solid #dce9e3;border-radius:16px;padding:22px}.tile:hover{background:#e0f6eb}.tile b{display:block;font-size:21px}.emoji{font-size:30px}.muted{color:#526c65}.tag{font-size:12px;background:#e0f4e9;padding:5px 10px;border-radius:20px}label{display:block;font-weight:600}input,textarea,select{width:100%;border:1px solid #9bbdb0;border-radius:9px;padding:10px;margin:5px 0 15px;background:white;color:#163b38}textarea{min-height:100px}.result{background:#e6f6ed;padding:16px;border-radius:12px;white-space:pre-wrap;margin-top:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stat{font-size:30px;font-weight:bold}.secondary{background:#e1f3e9;color:#175b48}.danger{background:#923b3b}footer{font-size:12px;color:#526c65;margin-top:30px}@media(max-width:700px){aside{position:static;width:auto;padding:12px;display:flex;flex-wrap:wrap;gap:4px}aside img{width:130px;object-fit:contain}aside button{width:auto;font-size:13px;padding:8px}main{margin:0;padding:16px}header{flex-wrap:wrap}.hero{padding:22px}h1{font-size:28px}}

.mobile-head,.mobile-bottom{display:none}
@media(max-width:700px){
body{overflow-wrap:anywhere} .mobile-head{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:white;padding:10px 14px;border-bottom:1px solid #dce9e3}.mobile-head img{width:76px;height:auto}.mobile-head strong{flex:1;font-size:18px}.mobile-head button{min-height:44px}.mobile-bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:white;border-top:1px solid #dce9e3;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:3px}.mobile-bottom button{flex:1;background:white;color:#17664f;padding:8px 2px;font-size:12px;min-height:48px}.mobile-bottom span{display:block;font-size:19px}aside{display:none;position:static;width:100%;padding:10px 14px}aside.open{display:block}aside>img,aside>h2{display:none}aside button{width:100%;min-height:44px;font-size:16px}main{margin:0;padding:16px 14px 100px;min-width:0}header{margin-bottom:14px}h1{font-size:26px}h2{font-size:21px}.hero{padding:20px;margin-bottom:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card,.tile{padding:14px;min-width:0}.tile b{font-size:17px}.tile{font-size:13px}.grid:not(#tiles){grid-template-columns:repeat(auto-fit,minmax(min(100%,145px),1fr))}input,select,textarea{font-size:16px;max-width:100%}button{min-height:44px}.row>*{max-width:100%}#features .card{overflow-wrap:anywhere} }
@media(max-width:360px){#tiles{grid-template-columns:1fr}}
</style></head><body><div class="mobile-head"><img src="assets/logo.png" alt="Allyviora AI"><strong>Allyviora AI</strong><button id="menuToggle" aria-expanded="false" aria-controls="sidebar">☰ Menu</button></div><aside id="sidebar"><img src="assets/logo.png" alt="Allyviora AI original logo"><h2>Allyviora AI</h2><nav id="nav" aria-label="Career navigation"></nav></aside><main><header><div><strong>YOUR CAREER COMPANION</strong><div class="muted">Beyond the hire. Beside you always.</div></div><span class="tag">Interactive demo</span></header><section id="view"><h1>Welcome to Allyviora AI</h1><p>Explore your career journey.</p></section><footer>Prototype V2.1 • Fictional jobs and simulated AI • No live authentication or email connection. Use sample data only.</footer></main><nav class="mobile-bottom" aria-label="Quick navigation"><button id="mobileHome"><span>⌂</span>Home</button><button id="mobileJobs"><span>🔎</span>Jobs</button><button id="mobileAI"><span>✦</span>AI</button><button id="mobileProfile"><span>♙</span>Profile</button></nav><script>
'use strict';
const $=id=>document.getElementById(id), view=$('view');
const pillars=[['Discover','🔎','Find opportunities with confidence',['Job Discovery','Trust Shield']],['Prepare','🎓','Build skills and confidence',['Resume Studio','Skill GPS']],['Apply','📋','Organize your job search',['Job Tracker','Ghost Watch','Inbox Sync']],['Succeed','🎯','Prepare for your next opportunity',['Interview Coach','Interview Debrief','Next-Round Drill','Offer Advisor']],['Support','🤝','Navigate your new workplace',['Work Assistant','Job Buddy','Onboarding']],['Thrive','📈','Grow your career',['Career Growth']]];
const tips={'Resume Studio':'Highlight relevant achievements, match job requirements and use accurate evidence.','Skill GPS':'Build a weekly learning plan: Python, APIs, JSON and a portfolio project.','Ghost Watch':'Review the last contact date and draft a polite follow-up. Silence does not prove rejection.','Inbox Sync':'Demo only. No email account is connected. Paste a fictional recruiter message for review.','Interview Coach':'Practice: Tell me about a challenging project. Structure your answer using Situation, Task, Action and Result.','Interview Debrief':'Identify a strong answer, an improvement area and a practice goal.','Next-Round Drill':'Practice role-specific questions and prepare questions for your interviewer.','Work Assistant':'Break your task into steps, consult approved documentation and test your solution. Do not share confidential data.','Job Buddy':'Set priorities and schedule a weekly check-in.','Onboarding':'Create a 30-day plan covering tools, team expectations and policies.','Career Growth':'Choose a measurable 90-day goal and review progress weekly.'};
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Browser storage is unavailable. Changes may reset.')}}let profile=load('allyProfile',{}),apps=load('allyApps',[]);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(html){view.innerHTML=html;window.scrollTo(0,0)}function btn(label,action,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=action;return b}function nav(){const n=$('nav');n.replaceChildren();[['Dashboard',home],['Welcome / Sign in',welcome],['My profile',onboard],...pillars.map((p,i)=>[p[1]+' '+p[0],()=>pillar(i)]),['AI Companion',coach],['Privacy settings',privacy]].forEach(([s,f])=>n.append(btn(s,f)))}
function home(){show(`<div class="hero"><span class="tag">Your next chapter</span><h1>Welcome${profile.name?', '+esc(profile.name):' to Allyviora AI'}</h1><p>One companion for every stage of your career.</p><button id="ask">Meet your AI companion</button></div><div class="grid"><div class="card"><div class="muted">Tracked applications</div><div class="stat">${apps.length}</div></div><div class="card"><div class="muted">Interviews</div><div class="stat">${apps.filter(a=>a.status==='Interview').length}</div></div><div class="card"><div class="muted">Career goal</div><b>${esc(profile.goal||'Set your goal')}</b></div></div><h2>Explore your career journey</h2><div class="grid" id="tiles"></div>`);$('ask').onclick=coach;pillars.forEach((p,i)=>{let b=btn('',()=>pillar(i),'tile');b.innerHTML=`<span class="emoji">${p[1]}</span><b>${p[0]}</b>${p[2]}`;$('tiles').append(b)})}
function welcome(){show('<div class="hero"><h1>Beyond the hire.</h1><p>Beside you always.</p><button id="start">Create demo profile / Continue</button></div><div class="card">No real account or password is required for this prototype.</div>');$('start').onclick=onboard}
function onboard(){show(`<div class="card"><h1>Personalize your journey</h1><form id="profile"><label for="name">Demo name</label><input id="name" value="${esc(profile.name||'')}" required><label for="goal">Target role</label><input id="goal" value="${esc(profile.goal||'')}" required><label for="stage">Career stage</label><select id="stage"><option>Job seeker</option><option>Interviewing</option><option>Employed</option><option>Career transition</option></select><button>Save profile</button></form></div>`);$('stage').value=profile.stage||'Job seeker';$('profile').onsubmit=e=>{e.preventDefault();profile={name:$('name').value,goal:$('goal').value,stage:$('stage').value};save('allyProfile',profile);home()}}
function pillar(i){let p=pillars[i];show(`<div class="hero"><h1>${p[1]} ${p[0]}</h1><p>${p[2]}</p></div><div class="grid" id="features"></div>`);p[3].forEach(n=>{let d=document.createElement('div');d.className='card';let h=document.createElement('h3');h.textContent=n;d.append(h,btn('Explore',()=>feature(n)));$('features').append(d)})}
function feature(n){if(n==='Job Discovery')return jobs();if(n==='Job Tracker')return tracker();if(n==='Trust Shield')return trust();if(n==='Offer Advisor')return offer();show(`<div class="card"><h1>${n}</h1><p class="muted">Simulated guidance • use fictional information</p><label for="q">Describe your goal or question</label><textarea id="q"></textarea><button id="go">Get guidance</button><div id="out" class="result" aria-live="polite">Your guidance will appear here.</div></div>`);$('go').onclick=()=>{$('out').textContent=$('q').value.trim()?tips[n]:'Enter a sample question first.'}}
const listings=[['Junior AI Developer','Maple Demo Labs','Toronto','Hybrid'],['Salesforce Administrator','North Demo Systems','Toronto','Remote'],['Business Analyst','Cedar Demo Group','Mississauga','On-site']];function jobs(){show('<div class="hero"><h1>Job Discovery</h1><p>Explore fictional sample opportunities.</p></div><label for="search">Filter by role or location</label><input id="search" placeholder="Search jobs"><div id="jobs"></div>');function render(){let q=$('search').value.toLowerCase();$('jobs').replaceChildren();listings.filter(a=>a.join(' ').toLowerCase().includes(q)).forEach(a=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<h3>${a[0]}</h3><p>${a.slice(1).join(' • ')}</p>`;d.append(btn('Assess trust',trust),document.createTextNode(' '),btn('Track job',()=>{apps.push({role:a[0],status:'Saved'});save('allyApps',apps);tracker()},'secondary'));$('jobs').append(d)})}$('search').oninput=render;render()}
function trust(){show('<div class="card"><h1>Trust Shield</h1><p>Evidence checklist, not a guarantee of legitimacy.</p><div id="checks"></div><button id="assess">Review evidence</button><div id="out" class="result" aria-live="polite"></div></div>');['Posting found on official company site','Recruiter identity independently confirmed','Company email domain matches','No requests for recruitment fees'].forEach(t=>{let l=document.createElement('label');let c=document.createElement('input');c.type='checkbox';c.style.width='auto';l.append(c,document.createTextNode(' '+t));$('checks').append(l)});$('assess').onclick=()=>{let n=$('checks').querySelectorAll(':checked').length;$('out').textContent=n+' of 4 evidence checks completed. '+(n===4?'Positive indicators; continue independent verification.':'Gather missing evidence before proceeding.')}}
function tracker(){show('<div class="card"><h1>Application Tracker</h1><form id="add"><label for="role">Job title</label><input id="role" required><button>Add application</button></form></div><div id="records"></div>');$('add').onsubmit=e=>{e.preventDefault();apps.push({role:$('role').value,status:'Applied'});save('allyApps',apps);tracker()};apps.forEach((a,i)=>{let d=document.createElement('div');d.className='card';let h=document.createElement('h3');h.textContent=a.role;let s=document.createElement('select');s.setAttribute('aria-label','Status for '+a.role);['Saved','Applied','Interview','Offer','Closed'].forEach(v=>s.add(new Option(v,v)));s.value=a.status;s.onchange=()=>{a.status=s.value;save('allyApps',apps)};d.append(h,s,btn('Remove',()=>{apps.splice(i,1);save('allyApps',apps);tracker()},'danger'));$('records').append(d)})}
function offer(){show('<div class="card"><h1>Offer Advisor</h1><label for="a">Offer A annual salary (CAD)</label><input id="a" type="number" min="0"><label for="b">Offer B annual salary (CAD)</label><input id="b" type="number" min="0"><button id="compare">Compare</button><div id="out" class="result"></div></div>');$('compare').onclick=()=>{$('out').textContent=(!$('a').value||!$('b').value)?'Enter both salaries.':'Annual salary difference: CAD '+Math.abs(Number($('a').value)-Number($('b').value)).toLocaleString()+'. Also compare benefits, commute, hours and growth.'}}
function coach(){show('<div class="hero"><h1>Your AI Companion</h1><p>Career support before, during and after employment.</p></div><div class="card"><label for="q">Ask a sample career question</label><textarea id="q"></textarea><button id="go">Ask Allyviora</button><div id="out" class="result" aria-live="polite">Ready to help.</div></div>');$('go').onclick=()=>{let q=$('q').value.toLowerCase();$('out').textContent='Simulated response: '+(!q.trim()?'Enter a question first.':q.includes('interview')?tips['Interview Coach']:q.includes('resume')?tips['Resume Studio']:q.includes('skill')?tips['Skill GPS']:tips['Career Growth'])}}
function privacy(){show('<div class="card"><h1>Privacy settings</h1><p>Demo profile and applications are stored in this browser only. No data is sent to an AI service. Do not enter sensitive information.</p><button id="clear" class="danger">Clear demo data</button></div>');$('clear').onclick=()=>{if(confirm('Clear your demo profile and applications?')){profile={};apps=[];save('allyProfile',profile);save('allyApps',apps);home()}}}nav();home();
function closeMenu(){ $('sidebar').classList.remove('open'); $('menuToggle').setAttribute('aria-expanded','false'); }
$('menuToggle').onclick=()=>{const open=$('sidebar').classList.toggle('open');$('menuToggle').setAttribute('aria-expanded',String(open));};
$('nav').addEventListener('click',e=>{if(e.target.closest('button'))closeMenu()});
[['mobileHome',home],['mobileJobs',jobs],['mobileAI',coach],['mobileProfile',onboard]].forEach(([id,fn])=>{$(id).onclick=()=>{closeMenu();fn()}});

</script></body></html>
